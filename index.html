<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guide di Viaggio Esclusive — Le Mie Destinazioni</title>
  <meta name="description" content="Guide di viaggio curate nei dettagli con itinerari giorno per giorno, consigli pratici e luoghi imperdibili.">
  <link rel="stylesheet" href="./styles/global.css">
  <link rel="stylesheet" href="./styles/home.css">
</head>
<body>

  <div id="nav-placeholder"></div>

  <header class="hero" style="background-image: url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1920&q=80');">
    <div class="hero-inner">
      <div class="eyebrow">Itinerari · Consigli · Mappe</div>
      <h1>LE MIE <span>GUIDE</span></h1>
      <div class="divider on-dark"><span class="diamond"></span></div>
      <a href="#destinations" class="hero-nav-btn">Esplora le Destinazioni ↓</a>
    </div>
  </header>

  <main>
    <section class="search-section">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Cerca una destinazione (es. New York, cibo, musei, Asia)..." aria-label="Cerca destinazione">
      </div>
    </section>

    <section class="destinations-section" id="destinations">
      <div class="destinations-header">
        <div class="eyebrow" style="color:var(--brick)">Dove siamo stati</div>
        <h2>Scegli la tua meta</h2>
      </div>

      <div class="grid-container" id="destinations-grid">
        <!-- Rendered dynamically via js/search.js from data/destinations.json -->
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="./js/components.js"></script>
  <script src="./js/scroll-animations.js"></script>
  <script src="./js/search.js"></script>
</body>
</html>
